[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forti-bar"
version = "0.2.2"
description = "A quiet, native Fortinet VPN companion for Linux"
requires-python = ">=3.11,<3.16"
dependencies = ["PySide6-Essentials==6.12.0"]
license = {text = "MIT"}

[project.scripts]
forti-bar = "fortibar.app:main"

[tool.setuptools.packages.find]
include = ["fortibar*"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]
